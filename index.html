<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Someone Special 💝</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #e8d5ff);
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 400px;
      padding: 35px 20px;
      text-align: center;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .heart {
      font-size: 45px;
      animation: beat 1s infinite;
    }

    .gift {
      font-size: 100px;
      cursor: pointer;
      margin: 15px;
    }

    h1 {
      color: #d63384;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
      color: #444;
    }

    button {
      border: none;
      padding: 13px 25px;
      border-radius: 30px;
      background: #d63384;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      display: none;
      margin-top: 20px;
    }

    @keyframes beat {
      50% {
        transform: scale(1.2);
      }
    }

    .heart-fall {
      position: fixed;
      top: -30px;
      font-size: 25px;
      animation: fall 4s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>एक छोटंसं Gift 🎁</h1>

    <p>हे तुझ्यासाठी आहे...</p>

    <div class="gift" onclick="openGift()">🎁</div>

    <button onclick="openGift()">Open Your Gift ✨</button>

    <div id="message">
      <p>
        🎉 Surprise! 🎉
        <br><br>
        तू माझ्यासाठी खूप Special आहेस. ❤️
        <br><br>
        तुझ्यासारखी व्यक्ती माझ्या आयुष्यात आहे,
        यासाठी मी खरंच Lucky आहे. ✨
        <br><br>
        हे छोटंसं Gift फक्त तुला सांगण्यासाठी... 🎁💖
      </p>
    </div>

  </div>

  <script>
    function openGift() {
      document.getElementById("message").style.display = "block";

      for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.className = "heart-fall";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }
    }
  </script>

</body>
</html>
